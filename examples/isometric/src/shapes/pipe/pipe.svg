<g
    highlighter-selector="base"
>
    <rect @selector="base" @group-selector="common"
        width="calc(w)"
        height="calc(h)"
        fill="transparent"
        stroke="none"
    />

    <path @selector="base2D" @group-selector="2d"
        :d="{{base2DPath([size])}}"
        fill="#e0e0e0"
        stroke="#333"
        stroke-linejoin="round"
    />

    <!-- Back arc: protruding part of far-end ellipse -->
    <path @selector="backArc" @group-selector="iso"
        :d="{{backArcPath([size, isometricHeight])}}"
        fill="#c6c6c6"
        stroke="#333"
        stroke-linejoin="round"
    />

    <!-- Body: mantle + closure arc through far ellipse -->
    <path @selector="body" @group-selector="iso"
        :d="{{bodyPath([size, isometricHeight])}}"
        fill="#e0e0e0"
        stroke="#333"
        stroke-linejoin="round"
    />

    <!-- Front ellipse: near end, fully visible -->
    <path @selector="frontEllipse" @group-selector="iso"
        :d="{{frontEllipsePath([size, isometricHeight])}}"
        fill="#c6c6c6"
        stroke="#333"
        stroke-linejoin="round"
    />

    <image @selector="topIcon" @group-selector="iso"
        href=""
        x="0" y="0" width="0" height="0"
        preserveAspectRatio="xMidYMid meet"
    />

    <image @selector="topIcon2D" @group-selector="2d"
        href=""
        x="0" y="0" width="0" height="0"
        preserveAspectRatio="xMidYMid meet"
    />

    <text @selector="label" @group-selector="common"
        text-anchor="left"
        text-vertical-anchor="middle"
        font-family="sans-serif"
        font-size="11"
        fill="#333"
        stroke="#fff"
        stroke-width="3"
        paint-order="stroke"
        y="calc(h + 10)"
        x="calc(w + 10)"
        text=""
    />
</g>
